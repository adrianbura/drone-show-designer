[project]
name = "dss-simulation-bridge"
version = "0.1.0"
description = "Local, simulation-only bridge between Drone Show Studio and PX4 SITL via MAVSDK"
requires-python = ">=3.10"
dependencies = [
  "fastapi>=0.110",
  "pydantic>=2.6",
  "uvicorn>=0.29",
]

[project.optional-dependencies]
# MAVSDK is only needed to actually talk to a local PX4 SITL instance.
# Mock-mode development and the whole default test suite work without it.
px4 = ["mavsdk>=2.0"]
dev = ["pytest>=8.0", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "integration: talks to a real local PX4 SITL instance",
  "requires_px4_sitl: skipped unless PX4 SITL is running locally",
]

[tool.setuptools.packages.find]
include = ["app*"]
